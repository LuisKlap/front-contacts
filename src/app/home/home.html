<div class="home-container">
  <div class="content">
    <div class="list-column">
      <div class="filters">
        <app-contact-filters (filterChange)="onFilter($event)" (create)="onCreate()">
        </app-contact-filters>
      </div>

      <div class="list">
        <app-contact-list [contacts]="contacts()" [loading]="loading()" [selectedContacts]="selectedContacts()"
          (select)="onSelect($event)" (edit)="onEdit($event)" (delete)="onDelete($event)" (create)="onCreate()">
        </app-contact-list>
      </div>
    </div>

    <div class="map-column">
      <app-map [contacts]="contacts()" [selectedContacts]="selectedContacts()">
      </app-map>
    </div>
  </div>

  <app-contact-form *ngIf="showForm()" [contact]="editingContact()" (save)="onSave($event)" (close)="onCloseForm()">
  </app-contact-form>

</div>
