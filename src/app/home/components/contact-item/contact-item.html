<div class="item" [class.selected]="selected" (click)="onSelect()">
  <div class="main-row">
    <div class="avatar">
      {{ getInitials() }}
    </div>

    <div class="info">
      <div class="name">{{ contact.name }}</div>
      <div class="phone">{{ formatPhone(contact.phone) }}</div>
    </div>
  </div>

  <div class="expanded" *ngIf="selected">
    <div class="details">
      <div class="detail-item"><strong>CPF:</strong> {{ formatCPF(contact.cpf) }}</div>
      <div class="detail-item"><strong>Endereço:</strong> {{ getFullAddress() }}</div>
    </div>
    <div class="actions">
      <button class="btn small" (click)="onEdit($event)">Edit</button>
      <button class="btn small danger" (click)="onDelete($event)">Delete</button>
    </div>
  </div>
</div>
