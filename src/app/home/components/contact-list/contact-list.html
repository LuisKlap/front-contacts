<div class="list-container">
  <div class="header">
    <h3>Contatos</h3>
    <button class="btn primary" (click)="onCreate()">Novo</button>
  </div>

  <div *ngIf="selectedContacts && selectedContacts.length > 0" class="selection-info">
    <span class="material-icons">pin_drop</span>
    {{ selectedContacts.length }} contato{{ selectedContacts.length > 1 ? 's' : '' }} selecionado{{
    selectedContacts.length > 1 ? 's' : '' }} no mapa
  </div>

  <div *ngIf="loading" class="loading">
    Carregando...
  </div>

  <div class="list">
    <app-contact-item *ngFor="let item of contacts" [contact]="item" [selected]="isSelected(item)"
      (select)="onSelect(item)" (edit)="onEdit(item)" (delete)="onDelete(item)">
    </app-contact-item>

    <div *ngIf="!loading && contacts.length === 0" class="empty">
      Nenhum contato encontrado.
    </div>
  </div>
</div>
