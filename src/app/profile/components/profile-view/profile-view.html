<div class="profile-view-container">
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>account_circle</mat-icon>
        Meu Perfil
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="loading" class="loading-container">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Carregando dados do usuário...</p>
      </div>

      <div *ngIf="error && !loading" class="error-message">
        <mat-icon color="warn">error</mat-icon>
        <p>{{ error }}</p>
      </div>

      <div *ngIf="user && !loading" class="user-info">
        <div class="info-item">
          <mat-icon>person</mat-icon>
          <div class="info-content">
            <span class="info-label">Nome</span>
            <span class="info-value">{{ user.fullName }}</span>
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="info-item">
          <mat-icon>email</mat-icon>
          <div class="info-content">
            <span class="info-label">E-mail</span>
            <span class="info-value">{{ user.email }}</span>
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="info-item" *ngIf="user.createdAt">
          <mat-icon>calendar_today</mat-icon>
          <div class="info-content">
            <span class="info-label">Membro desde</span>
            <span class="info-value">{{ user.createdAt | date: 'dd/MM/yyyy' }}</span>
          </div>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
      <button mat-raised-button color="primary" (click)="navigateToEdit()" [disabled]="loading">
        <mat-icon>edit</mat-icon>
        Editar Perfil
      </button>
      <button mat-raised-button color="warn" (click)="navigateToDelete()" [disabled]="loading">
        <mat-icon>delete_forever</mat-icon>
        Excluir Conta
      </button>
    </mat-card-actions>
  </mat-card>
</div>
