<div class="min-h-screen">
  <div class="min-h-screen__overlay"></div>
  <div class="signup-container">
    <mat-card class="signup-card">
      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        <h2 class="title">Criar conta</h2>

        <mat-form-field appearance="outline" class="form-field" floatLabel="auto">
          <mat-label>Nome completo</mat-label>
          <input matInput formControlName="fullName" placeholder="João Silva" required />
          <mat-error *ngIf="fullName?.hasError('required')">Nome completo é obrigatório</mat-error>
          <mat-error *ngIf="fullName?.hasError('minlength')">Digite ao menos 3 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field" floatLabel="auto">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="usuario@exemplo.com" required autocomplete="email" />
          <mat-error *ngIf="email?.hasError('required')">Email é obrigatório</mat-error>
          <mat-error *ngIf="email?.hasError('email')">Digite um email válido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field" floatLabel="auto">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="senha" required
            autocomplete="new-password" />

          <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
            [attr.aria-label]="hide ? 'Mostrar senha' : 'Ocultar senha'">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="button-group">
          <button mat-raised-button color="primary" type="submit" [disabled]="signUpForm.invalid || isLoading">
            <ng-container *ngIf="isLoading; else textLabel">
              <mat-progress-spinner mode="indeterminate" diameter="18" strokeWidth="3"
                [style.marginRight.px]="8"></mat-progress-spinner>
            </ng-container>
            <ng-template #textLabel>
              Criar conta
            </ng-template>
          </button>

          <button mat-stroked-button type="button" (click)="onSignIn()">Já tem uma conta? Entre</button>
        </div>
      </form>
    </mat-card>
  </div>
</div>
