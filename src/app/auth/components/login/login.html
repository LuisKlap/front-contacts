<!-- login.html -->
<div class="min-h-screen">
  <div class="min-h-screen__overlay"></div>
  <div class="login-container">
    <mat-card class="login-card">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <h2 class="title">Entrar</h2>

        <mat-form-field appearance="outline" class="form-field" floatLabel="auto">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="usuario@exemplo.com" required autocomplete="email" />
          <mat-error *ngIf="email?.hasError('required')">Email é obrigatório</mat-error>
          <mat-error *ngIf="email?.hasError('email')">Digite um email válido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field" floatLabel="auto">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="senha" required
            autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="hide = !hide"
            [attr.aria-label]="hide ? 'Mostrar senha' : 'Ocultar senha'">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="password?.hasError('required')">Senha é obrigatória</mat-error>
        </mat-form-field>

        <div class="button-group">
          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading">
            <ng-container *ngIf="isLoading; else textLabel">
              <mat-progress-spinner mode="indeterminate" diameter="18" strokeWidth="3"
                [style.marginRight.px]="8"></mat-progress-spinner>
            </ng-container>
            <ng-template #textLabel>Entrar</ng-template>
          </button>

          <button mat-stroked-button type="button" (click)="onSignUp()">Não tem uma conta? Cadastre-se</button>
        </div>
      </form>
    </mat-card>
  </div>
</div>
